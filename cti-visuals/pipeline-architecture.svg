<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">CTI IOC enrichment pipeline</title><desc id="desc">CLI or CSV input is validated, enriched using VirusTotal, AbuseIPDB, and optional MISP, assessed using rules, and written to JSON and Markdown reports for analyst review.</desc>
<rect width="1100" height="390" rx="22" fill="#0d1425"/>
<text x="45" y="50" font-size="25" font-family="Arial,sans-serif" fill="#f8fafc" font-weight="bold">CTI / OSINT IOC Enrichment Pipeline</text>
<text x="45" y="77" font-size="14" font-family="Arial,sans-serif" fill="#9caec9">Evidence-based enrichment • optional MISP • analyst-reviewed decisions</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="38" y="125" width="174" height="98" rx="13" fill="#172b49" stroke="#3b82f6" stroke-width="2"/><text x="125" y="165" font-size="18" fill="#fff" font-weight="bold">CLI / CSV</text><text x="125" y="189" font-size="13" fill="#c8d8f0">IOC input</text>
<rect x="254" y="125" width="174" height="98" rx="13" fill="#172b49" stroke="#3b82f6" stroke-width="2"/><text x="341" y="165" font-size="18" fill="#fff" font-weight="bold">Validation</text><text x="341" y="189" font-size="13" fill="#c8d8f0">Type + format</text>
<rect x="470" y="112" width="200" height="126" rx="13" fill="#17334a" stroke="#34d399" stroke-width="2"/><text x="570" y="144" font-size="18" fill="#fff" font-weight="bold">Enrichment</text><text x="570" y="170" font-size="14" fill="#c8f4e6">VirusTotal</text><text x="570" y="191" font-size="14" fill="#c8f4e6">AbuseIPDB</text><text x="570" y="212" font-size="13" fill="#b7c8d5">MISP (optional)</text>
<rect x="712" y="125" width="174" height="98" rx="13" fill="#352544" stroke="#c084fc" stroke-width="2"/><text x="799" y="165" font-size="18" fill="#fff" font-weight="bold">Assessment</text><text x="799" y="189" font-size="13" fill="#e5d5f7">Rules + priority</text>
<rect x="928" y="125" width="140" height="98" rx="13" fill="#34301f" stroke="#fbbf24" stroke-width="2"/><text x="998" y="165" font-size="17" fill="#fff" font-weight="bold">Reports</text><text x="998" y="189" font-size="13" fill="#f5e7bf">JSON + MD</text>
</g>
